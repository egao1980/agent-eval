name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main

  # Live container lane (modelled on compute-backend-podman's): the ubuntu VM
  # (not the ci-base container) has podman. The test image is pulled here, and
  # one Terminal-Bench 2 task (harbor-framework/terminal-bench-2 regex-log, at
  # a pinned commit; Apache-2.0, fetched, not vendored) is run end to end with
  # the oracle agent, its image built from environment/Dockerfile.
  # AGENT_EVAL_PODMAN_LIVE=require makes a blocked lane fail instead of skip.
  test-podman-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    env:
      AGENT_EVAL_PODMAN_LIVE: require
      AGENT_EVAL_TEST_IMAGE: docker.io/library/debian:bookworm-slim
      TB2_REPO: https://github.com/harbor-framework/terminal-bench-2
      TB2_COMMIT: 2fd12b88aafdd04a52c298e3940bcb189f9766d6
      TB2_TASK: regex-log
    steps:
      - uses: actions/checkout@v5
      - name: Podman and the test image
        shell: bash
        run: |
          podman --version
          podman info --format '{{.Host.OS}} rootless={{.Host.Security.Rootless}} cgroups={{.Host.CgroupsVersion}}'
          # TB2 Dockerfiles use short names (FROM ubuntu:24.04).
          mkdir -p "$HOME/.config/containers"
          printf 'unqualified-search-registries = ["docker.io"]\nshort-name-mode = "permissive"\n' \
            > "$HOME/.config/containers/registries.conf"
          podman pull -q "$AGENT_EVAL_TEST_IMAGE"
      - name: Terminal-Bench 2 task (pinned)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/terminal-bench-2"
          git clone -q --filter=blob:none --no-checkout --sparse "$TB2_REPO" "$dir"
          git -C "$dir" sparse-checkout set "$TB2_TASK"
          git -C "$dir" checkout -q "$TB2_COMMIT"
          ls -R "$dir/$TB2_TASK"
          echo "AGENT_EVAL_TB2_TASK=$dir/$TB2_TASK" >> "$GITHUB_ENV"
      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
